<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 112" width="100%" height="100%" fill="none">
  <defs>
    <!-- Google Fonts Inter Import & System Typography Fallback -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&amp;display=swap');
      .brand-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 100px;
        letter-spacing: 0.01em;
      }
    </style>

    <!-- Operis Stream Mark (Varyasyon 1 - Koyu Zemin / Platin Beyazı #FAFAFA) -->
    <g id="operisStreamMarkWhite">
      <!-- 1. Dış Akış Şeridi -->
      <path d="M 25.50 124.50 A 70 70 0 0 1 124.50 25.50" 
            stroke="#FAFAFA" stroke-width="10" stroke-linecap="round" fill="none"/>
      
      <!-- 2. Merkez Akış Şeridi -->
      <path d="M 36.11 113.89 A 55 55 0 0 1 113.89 36.11" 
            stroke="#FAFAFA" stroke-width="10" stroke-linecap="round" fill="none"/>
      
      <!-- 3. İç Akış Şeridi -->
      <path d="M 46.72 103.28 A 40 40 0 0 1 103.28 46.72" 
            stroke="#FAFAFA" stroke-width="10" stroke-linecap="round" fill="none"/>

      <!-- 4. Birleşik Monolitik Gövde -->
      <path d="M 113.89 36.11 A 55 55 0 0 1 36.11 113.89" 
            stroke="#FAFAFA" stroke-width="40" stroke-linecap="butt" fill="none"/>
    </g>
  </defs>

  <!-- ==================== OPERIS LOGO (KOYU TEMA / DARK MODE) ==================== -->
  <!-- 
    Özellikler:
    - Şeffaf (transparent) arka plan: Navbar, header, hero ve koyu kartlara doğrudan oturur.
    - Sıkı kırpılmış (tight) viewBox (350x112): Fazladan boşluk bırakmaz, CSS'te h-8, h-10, h-12 ile tam boyutlanır.
    - Logo boyutu: 81px (%108 optik O harfi ölçeği, tepe noktası 'i' noktasının hizasında).
    - Harf boşluğu (kerning): Optik dengelenmiş doğal kerning (O ile p arası diğer harflerle tam eşitlendi).
  -->
  <g id="operisWordmark">
    <!-- 'O' HARFİ YERİNE LOGO SEMBOLÜ -->
    <g transform="translate(11, 6) scale(0.54)">
      <use href="#operisStreamMarkWhite"/>
    </g>

    <!-- 'peris' KÜÇÜK HARFLER -->
    <text x="90" y="85" fill="#FAFAFA" class="brand-text">peris</text>
  </g>
</svg>
