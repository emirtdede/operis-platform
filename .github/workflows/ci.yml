name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Lint, Typecheck, Audits, Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@12.3.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint check
        run: pnpm lint

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Zero-emoji policy audit
        run: pnpm audit:emoji

      - name: i18n locale parity audit
        run: pnpm audit:i18n

      - name: Run Unit Tests
        run: pnpm test:unit

      - name: Production Build
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: https://operis.pro
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/freelance_platform
          SESSION_SECRET: sessionsecretmustbe32charactersminimumlengthforsecurity
          PII_ENCRYPTION_KEY_CURRENT: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PII_HMAC_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          EMAIL_FROM: noreply@operis.pro
