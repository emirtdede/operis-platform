name: Operis CI/CD Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  quality-gate:
    name: Code Quality, Security & Test Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: 1. Strict TypeScript Typecheck
        run: pnpm typecheck

      - name: 2. ESLint Code Hygiene (0 Errors / 0 Warnings)
        run: pnpm lint

      - name: 3. Zero-Emoji Compliance Audit
        run: pnpm audit:emoji

      - name: 4. Dual-Language (TR/EN) Parity Audit
        run: pnpm audit:i18n

      - name: 5. Unit & Security Matrix Test Suite (5,170+ Tests)
        run: pnpm test:unit

      - name: 6. WAI-ARIA & Accessibility (a11y) Test Suite
        run: pnpm test:a11y
