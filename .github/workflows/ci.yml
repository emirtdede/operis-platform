name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Lint, Typecheck, Audits, Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code format check
        run: pnpm format:check

      - name: ESLint check
        run: pnpm lint

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Zero-emoji policy audit
        run: pnpm audit:emoji

      - name: i18n locale parity audit
        run: pnpm audit:i18n

      - name: Run Unit Tests
        run: pnpm test:unit

      - name: Production Build
        run: pnpm build
        env:
          NODE_ENV: production
          APP_URL: https://freelance-platform.local
          PRODUCT_NAME: "Freelance Platform"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/freelance_platform
